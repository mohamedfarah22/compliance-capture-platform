project_id = "compliance-capture-platform"

[api]
enabled = true
port = 54321
schemas = ["public", "ttr", "graphql_public"]
extra_search_path = ["public", "extensions"]
max_rows = 1000

[db]
port = 54322
shadow_port = 54320
major_version = 15

[studio]
enabled = true
port = 54323

[inbucket]
enabled = true
port = 54324

[storage]
enabled = true
file_size_limit = "10MiB"

[auth]
enabled = true
site_url = "http://127.0.0.1:3000"
additional_redirect_urls = ["http://localhost:3000"]
jwt_expiry = 3600
enable_signup = false

[auth.sessions]
# Ends a session that has made no refresh-token request for this long. Backs up the
# 10 minute idle sign-out in AuthContext. The hosted projects need the same setting.
# Check against jwt_expiry (3600): the client only refreshes near expiry, so a limit
# this short may end sessions of active users at their next refresh (see UAT 3.7).
inactivity_timeout = "10m"

[auth.mfa]
max_enrolled_factors = 10

[auth.mfa.totp]
enroll_enabled = true
verify_enabled = true

[functions.complete-transaction]
verify_jwt = true

[functions.delete-draft-transaction]
verify_jwt = true

[functions.upload-id-image]
verify_jwt = true

[functions.get-id-image-urls]
verify_jwt = true

[functions.cleanup-stale-drafts]
verify_jwt = false

[functions.generate-austrac-report]
verify_jwt = false

# The secret key is not a JWT, so the gateway check is off and the function checks the
# key itself, as generate-austrac-report does.
[functions.reconcile-stored-images]
verify_jwt = false

[functions.approve-batch]
verify_jwt = true
